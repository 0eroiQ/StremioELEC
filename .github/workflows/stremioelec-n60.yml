name: StremioELEC N60 test image

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish verified test packages to Releases (never promotes box updates)
        type: boolean
        default: false
  push:
    branches: [stremioelec/n60-image-pipeline]
    paths: [stremioelec/**, skin.stremioelec/**, .github/workflows/stremioelec-n60.yml]
  pull_request:
    paths: [stremioelec/**, skin.stremioelec/**, .github/workflows/stremioelec-n60.yml]

permissions:
  contents: read

concurrency:
  group: n60-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/stremioelec/n60-image-pipeline'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            stremioelec
            licenses
            skin.stremioelec
      - name: Validate image tooling
        run: python3 -m unittest discover -s stremioelec/tests -v
      - name: Test Stremio integration
        run: python3 -m unittest discover -s skin.stremioelec/integration -p 'test_*.py'
      - name: Install image tools
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y squashfs-tools dosfstools util-linux
      - name: Build pinned test image (no publishing or device writes)
        if: github.event_name != 'pull_request'
        run: |
          sudo env GITHUB_ACTIONS=true BUILD_COMMIT="$GITHUB_SHA" python3 stremioelec/build_image.py \
            --skin "$GITHUB_WORKSPACE/skin.stremioelec" --output "$GITHUB_WORKSPACE/image-output"
          sudo chown -R "$(id -u):$(id -g)" image-output
      - name: Verify final artifacts
        if: github.event_name != 'pull_request'
        working-directory: image-output
        run: sha256sum -c SHA256SUMS
      - name: Upload test artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StremioELEC-N60-test-${{ github.run_number }}
          path: image-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Acceptance boundary
        if: github.event_name != 'pull_request'
        run: |
          echo '### N60 test image only' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified hashes, package dependency closure and image contents. Not yet boot-tested on N60; no USB or Android disk written. This build cannot publish/promote the independent approved update channel.' >> "$GITHUB_STEP_SUMMARY"


  portable:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/stremioelec/n60-image-pipeline'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            stremioelec
            skin.stremioelec
      - name: Build portable Kodi repository
        run: python3 stremioelec/build_portable.py --output "$GITHUB_WORKSPACE/portable-output"
      - name: Verify portable artifacts
        working-directory: portable-output
        run: sha256sum -c SHA256SUMS
      - name: Upload portable Kodi test repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StremioELEC-Kodi-test-${{ github.run_number }}
          path: portable-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  publish-portable-test:
    needs: portable
    if: github.event_name == 'push' && github.ref == 'refs/heads/stremioelec/n60-image-pipeline'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: StremioELEC-Kodi-test-${{ github.run_number }}
          path: portable-output
      - name: Publish isolated portable test repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch portable-repository-test \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a portable-output/repository/. publish/
          cp portable-output/repository.stremioelec.test-0.2.0.zip publish/
          cp portable-output/portable-manifest.json publish/
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Portable test repository unchanged"
          else
            git commit -m "Publish StremioELEC for Kodi test ${GITHUB_SHA}"
            git push origin HEAD:portable-repository-test
          fi

  prerelease:
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease && github.ref == 'refs/heads/stremioelec/n60-image-pipeline'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: stremioelec
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: StremioELEC-N60-test-${{ github.run_number }}
          path: release-assets
      - name: Publish verified prerelease (no stable channel change)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 stremioelec/publish_prerelease.py release-assets
